<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herocare</title>
<meta name="description" content="Herocare – nạp ca và bảng lương nội bộ">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d4d43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herocare">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --brand: #1d4d43; --mint: #6fd0ae; --ink: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--brand); overflow: hidden; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 0 0; box-sizing: border-box; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: #eef2f0; }
  .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--ink); background: var(--brand); text-align: center; padding: 24px; transition: opacity .3s; }
  .splash.done { opacity: 0; pointer-events: none; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.1); display: grid; place-items: center; font-weight: 800; font-size: 22px; letter-spacing: .04em; }
  .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--mint); animation: run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
  .slow { font-size: 13px; opacity: .85; max-width: 300px; }
  .slow a { color: var(--mint); }
</style>
</head>
<body>
<!--
  APP_URL = link /exec của bản triển khai Apps Script (Triển khai → Quản lý bản triển khai).
  Khi “Phiên bản: Mới” trên CÙNG bản triển khai thì link không đổi, không cần sửa file này.
-->
<script>const APP_URL = '';</script>

<iframe id="app" title="Herocare" allow="clipboard-write"></iframe>
<div class="splash" id="splash">
  <div class="mark">HC</div>
  <div style="font-weight:700;letter-spacing:.14em">HEROCARE</div>
  <div class="bar" id="bar"><i></i></div>
  <div class="slow" id="slow" hidden></div>
</div>

<script>
  const splash = document.getElementById('splash'), slow = document.getElementById('slow');
  if (!APP_URL) {
    document.getElementById('bar').hidden = true;
    slow.hidden = false;
    slow.textContent = 'Ứng dụng đang được cài đặt. Vui lòng quay lại sau.';
  } else {
    const frame = document.getElementById('app');
    frame.addEventListener('load', () => splash.classList.add('done'));
    frame.src = APP_URL;
    setTimeout(() => {
      if (splash.classList.contains('done')) return;
      slow.hidden = false;
      slow.innerHTML = 'Mạng đang chậm… Nếu chờ lâu, <a href="' + APP_URL + '" target="_top" rel="noopener">mở trực tiếp ứng dụng</a>.';
    }, 10000);
  }
</script>
</body>
</html>
